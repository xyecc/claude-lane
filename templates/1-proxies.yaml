# 模板①：proxies 增强文件 —— 静态IP节点
# 写入位置：$CFG/profiles/<订阅option里proxies对应的uid>.yaml
# 《》内为需要替换的占位符；三个关键项 type/udp/dialer-proxy 一个都不能改

prepend: []

append:
  - name: "🇺🇸 US-Static"
    type: socks5                      # 必须 socks5（http 方式已淘汰，实测不稳）
    server: 《静态IP主机，形如 198.51.100.10》
    port: 《静态IP端口，形如 12324》
    username: "《静态IP用户名》"
    password: "《静态IP密码》"
    udp: false                        # 必须 false：QUIC 走不通才会回落 TCP，这是防漏流的一环
    dialer-proxy: "US-Chain"          # 必须：先走机场美国节点，再连 静态 IP（国内直连 静态 IP 不通）

delete: []
