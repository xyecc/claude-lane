# 模板③：rules 增强文件 —— 全套规则
# 写入位置：$CFG/profiles/<订阅option里rules对应的uid>.yaml
# 整体照抄，顺序敏感：QUIC 拦截必须排最前。没有占位符。
# 注意：不含全局 "AND,((NETWORK,UDP),(DST-PORT,443)),REJECT" —— 那会误伤全机 HTTP/3，
#       已被下面的进程级拦截取代，不要自作主张加回去。

prepend:
  # ── 1. Chrome 的 QUIC（UDP/443）会绕过域名规则漏出去，拒绝后无感回落 TCP
  #    漏到哪取决于节点支不支持 UDP：支持 → 漏到机场默认节点（实测显示日本）；
  #    不支持（静态节点 udp:false、很多机场节点也是）→ mihomo 跳过所有规则直接 DIRECT →
  #    国内 IP → claude.ai 跳「App unavailable in region」（2026-11-02 实测）。
  #    ⚠️ 必须用正则匹配进程名，不要写精确名：Chrome 会改 Helper 进程的名字
  #    （Chrome 156 起网络进程叫「Google Chrome Helper (Aperitif)」，旧的精确名规则静默失效）。
  #    PROCESS-NAME-REGEX 需要 mihomo ≥ v1.18.5。各版本进程名见 docs/compatibility.md
  - "AND,((PROCESS-NAME-REGEX,^Google Chrome),(NETWORK,UDP),(DST-PORT,443)),REJECT"
  # ⚠️ 这里只拦了 Google Chrome（含 Beta / Canary）。其他 Chromium 系浏览器 QUIC 同样会漏，
  #    用的话照抄上面这条、把正则换成（verify.sh 第 3 项发现它们在跑却没拦会黄色提醒）：
  #      Edge:  ^Microsoft Edge
  #      Brave: ^Brave Browser
  #      Arc:   ^Arc( Helper.*)?$
  #    Safari 的网络请求走系统进程，没有干净的进程级拦法；用 Safari 出现漏流就换浏览器访问 claude.ai。

  # ── 2. Claude 桌面版全家的 UDP 同理拒绝，强制走 TCP
  - "AND,((PROCESS-NAME,Claude Helper),(NETWORK,UDP)),REJECT"
  - "AND,((PROCESS-NAME,Claude Helper (GPU)),(NETWORK,UDP)),REJECT"
  - "AND,((PROCESS-NAME,Claude Helper (Renderer)),(NETWORK,UDP)),REJECT"
  - "AND,((PROCESS-NAME,Claude Helper (Plugin)),(NETWORK,UDP)),REJECT"
  - "AND,((PROCESS-NAME,Claude),(NETWORK,UDP)),REJECT"
  - "AND,((PROCESS-NAME,claude.exe),(NETWORK,UDP)),REJECT"
  - "AND,((PROCESS-NAME,claude),(NETWORK,UDP)),REJECT"
  - "AND,((PROCESS-PATH-REGEX,/.local/share/claude/versions/),(NETWORK,UDP)),REJECT"

  # ── 3. Claude 桌面版按进程名导流（最可靠，不受 DNS/IP 影响；顺带覆盖 claude CLI）
  - "PROCESS-NAME,Claude Helper,Claude"
  - "PROCESS-NAME,Claude Helper (GPU),Claude"
  - "PROCESS-NAME,Claude Helper (Renderer),Claude"
  - "PROCESS-NAME,Claude Helper (Plugin),Claude"
  - "PROCESS-NAME,Claude,Claude"
  # ⚠️ Claude Code 的进程名两个都要写。磁盘上的文件叫 claude.exe（连 macOS 上也是），
  #    但 mihomo 匹配的是内核看到的进程名（`ps -axo comm`），实测显示为小写 claude。
  #    只写 claude.exe 的话规则永远不命中 → anthropic 域名靠域名规则还能兜住，
  #    但 Datadog 等遥测域名会漏到默认节点（2026-07 实测漏到日本，见排障手册第 9 条）。
  #    别靠 ps 看进程名（它显示的是启动时的名字），mihomo 看的是解析过符号链接的真实可执行文件，
  #    verify.sh 第 3 项会用同样的方式核对本机在跑的 Claude 进程是否都被覆盖。
  - "PROCESS-NAME,claude.exe,Claude"
  - "PROCESS-NAME,claude,Claude"
  # ⚠️ Claude Code 原生安装版（~/.local/bin/claude → ~/.local/share/claude/versions/<版本号>）
  #    在 mihomo 眼里进程名就是版本号（如 2.1.316），每次升级都变，上面两条按名字的规则抓不到，
  #    只能按路径匹配（2026-11-02 实测）。PROCESS-PATH-REGEX 需要 mihomo ≥ v1.18.5
  - "PROCESS-PATH-REGEX,/.local/share/claude/versions/,Claude"

  # ── 4. 域名兜底（网页版、Claude Code、其他工具）
  - "DOMAIN-SUFFIX,anthropic.com,Claude"
  - "DOMAIN-SUFFIX,claude.com,Claude"
  - "DOMAIN-SUFFIX,claude.ai,Claude"
  - "DOMAIN-SUFFIX,claudeusercontent.com,Claude"
  - "DOMAIN-KEYWORD,anthropic,Claude"

  # ── 4b. Claude Code 的遥测域名（⚠️ 别省，2026-07-25 实测这条不加就在漏）
  # 为什么必须靠域名而不是进程规则：实测发现 mihomo 对这条连接**识别不出进程**
  # （/connections 里 process 字段为空），所以任何 PROCESS-NAME 规则都抓不到它，
  # 结果遥测请求命中 MATCH 兜底、从机场默认节点（日本）发出去 —— 与"固定美国 IP"的初衷相反。
  # 只写这个精确主机名，不要写 DOMAIN-SUFFIX,datadoghq.com：
  # 后者会把其他网站的 Datadog 前端埋点也拽进静态 IP，反而污染"这个 IP 只访问 Anthropic"的画像。
  # 如果哪天日志里出现别的分片（us3 / eu1 等），照样式加一条；verify.sh 的漏流扫描会替你发现。
  - "DOMAIN-SUFFIX,http-intake.logs.us5.datadoghq.com,Claude"

  # ── 5. Anthropic 自有 IP 段兜底
  - "IP-CIDR,160.79.104.0/23,Claude,no-resolve"

  # ── 6. 支付规则已移出本模板（默认不启用）
  #    见 templates/optional-payment-rules.yaml：副作用是【任何网站】的 Stripe/Google Pay 付款
  #    都会走静态 IP，会稀释"这个 IP 只访问 Anthropic"的画像；而且 Claude 订阅本来就不收
  #    中国大陆发行的卡，多数人加了也没用。确有需要再照那个文件追加。

append: []

delete: []
